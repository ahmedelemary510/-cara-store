    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>

        <a href="#"><img src="img/logo.png" class="logo" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="index-Arabic.html">الرئيسية</a></li>

                <li><a href="blog-Arabic.html">المدونة</a></li>

                <li id="langToggleLi"><a href="#" id="langToggle">عربي|🌐|En</a></li>

            <i id="bar" class='bx bx-menu'></i>
        </div>

    <div class="auth-wrapper">
        <div class="auth-container" id="authContainer">

            <div class="form-box login-box" id="loginBox">
                <h2>تسجيل الدخول</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
                    </div>
                    <button type="submit" class="auth-btn">تسجيل الدخول</button>
                    <p class="switch-text">ليس لديك حساب؟ <a href="#" id="showRegister">إنشاء حساب</a></p>
                </form>
            </div>

            <div class="form-box register-box hidden" id="registerBox">
                <h2>إنشاء حساب</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" placeholder="اسم المستخدم" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="كلمة المرور" required>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">أوافق على الشروط والأحكام</label>
                    </div>
                    <button type="submit" class="auth-btn">إنشاء حساب</button>
                    <p class="switch-text">لديك حساب بالفعل؟ <a href="#" id="showLogin">تسجيل الدخول</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
