<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Cara</title>
    <link rel="icon" type="image/x-icon" href="./img/icon1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <section id="header">
        <a href="#"><img src="img/logo.png" class="logo" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a class="active" href="auth.html">Account</a></li>
                <li id="langToggleLi"><a href="#" id="langToggle">عربي|🌐|En</a></li>
                <li><a href="favorites.html"><i class='bx bx-heart' ></i></a></li>
                    <li id="lg-bag"><a href="cart.html"><i class='bx bx-shopping-bag'></i></a></li>
                <a href="#" id="close"><i class='bx bx-x'></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="favorites.html"><i class='bx bx-heart' ></i></a>
                <a href="cart.html"><i class='bx bx-shopping-bag'></i></a>
            <i id="bar" class='bx bx-menu'></i>
        </div>
    </section>

    <div class="auth-wrapper">
        <div class="auth-container" id="authContainer">

            <div class="form-box login-box" id="loginBox">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="E-mail" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>
                    <button type="submit" class="auth-btn">Login</button>
                    <p class="switch-text">Don't have an account? <a href="#" id="showRegister">Register</a></p>
                </form>
            </div>


            <div class="form-box register-box hidden" id="registerBox">
                <h2>Registration</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="regName" placeholder="User name" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="E-mail" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Password" required>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the terms & conditions</label>
                    </div>
                    <button type="submit" class="auth-btn">Register</button>
                    <p class="switch-text">Already have an account? <a href="#" id="showLogin">Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
